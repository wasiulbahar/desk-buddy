<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Desk Buddy">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Desk Buddy</title>
<style>
  :root { --eye: rgb(90,240,255); }
  html, body {
    margin: 0; height: 100%; background: #000; overflow: hidden;
    touch-action: none; user-select: none; -webkit-user-select: none;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--eye);
  }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; transition: filter 1s; }
  #bubble {
    position: fixed; left: 50%; top: max(5%, env(safe-area-inset-top));
    transform: translate(-50%, -16px); opacity: 0; transition: opacity .35s, transform .35s;
    background: rgba(15, 30, 40, .9); border: 1px solid currentColor; border-radius: 20px;
    padding: 10px 20px; font-size: clamp(14px, 3.8vmin, 28px); line-height: 1.35;
    max-width: 82vw; text-align: center; pointer-events: none;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #bubble small { opacity: .65; font-size: .7em; }
  #bubble.show { opacity: 1; transform: translate(-50%, 0); }
  #hud {
    position: fixed; left: 0; right: 0; bottom: max(10px, env(safe-area-inset-bottom));
    display: flex; justify-content: center; align-items: center; gap: 20px; opacity: .4; pointer-events: none;
    font-size: clamp(11px, 2.6vmin, 17px); font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  .bar { display: inline-block; width: 52px; height: 6px; margin-left: 6px; vertical-align: middle;
         background: rgba(255,255,255,.12); border-radius: 3px; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: var(--eye); transition: width .8s; }
  #snd, #bond { pointer-events: auto; cursor: pointer; padding: 6px 10px; margin: -6px -10px; }
  #mailc:empty, #next:empty { display: none; }
  @media (max-width: 640px) { #hud .sys { display: none; } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="bubble"></div>
<div id="hud">
  <span id="clock">--:--</span>
  <span class="sys">CPU<span class="bar"><i id="cpu"></i></span></span>
  <span class="sys">RAM<span class="bar"><i id="ram"></i></span></span>
  <span id="work">⏱ 0m</span>
  <span id="mailc"></span>
  <span id="next"></span>
  <span id="bond" title="Your buddy"></span>
  <span id="snd" title="Sound on/off">🔊</span>
</div>
<script>
const $ = id => document.getElementById(id);
const cv = $('c'), ctx = cv.getContext('2d');
const params = new URLSearchParams(location.search);

// The switches from the PC dashboard (these defaults are used until the PC sends its own).
const DEFAULT_PREFS = {
  music: true, reading: true, meeting: true, suspicious: true, stress: true, quirks: true,
  breaks: true, breakMinutes: 50, bedtime: true, mailAlerts: true, calendarAlerts: true,
  soundOutput: 'phone', volume: 80, cheeky: 0, sensors: true, mic: true,
};
const P = k => ((state && state.prefs) || DEFAULT_PREFS)[k];

// What you're doing, judged from the window title.
const FUN_RE = /youtube|netflix|twitch|reddit|instagram|tiktok|facebook|prime video|disney\+|9gag/i;
const WORK_RE = /visual studio|vs ?code|pycharm|intellij|android studio|sublime|notepad\+\+|vim|terminal|powershell|command prompt|figma|github| - (word|excel|powerpoint)$/i;
const READ_RE = /\.pdf\b|\bpdf\b|acrobat|foxit|sumatra|okular|google docs|google drive|wikipedia|medium|kindle|arxiv|substack|notion|\.epub\b|calibre|e-?book|reader view|scribd|researchgate|goodreads/i;
const MEET_RE = /zoom meeting|zoom workplace|meeting \| microsoft teams|call \| microsoft teams|\| microsoft teams.*(meeting|call)|google meet|meet\.google|^meet - |webex|skype/i;

// Eye shapes. lid = top lid closed, tilt > 0 angry / < 0 worried, happy = ^_^ curve,
// sparkle = shiny eyes and twinkles, spiral = dizzy swirls, glasses = reading glasses on.
const BASE = { w: 1, h: 1, lidL: 0, lidR: 0, tilt: 0, happy: 0, sparkle: 0, spiral: 0, glasses: 0, color: [90, 240, 255] };
const shape = o => ({ ...BASE, ...o });
const MOODS = {
  neutral:     shape({}),
  happy:       shape({ w: 1.05, happy: .55 }),
  love:        shape({ w: 1.05, happy: .55, sparkle: 1, color: [255, 110, 175] }),
  content:     shape({ w: 1.05, h: .85, lidL: .15, lidR: .15, happy: .5, sparkle: 1 }),
  giggle:      shape({ w: 1.1, h: .9, happy: .62, sparkle: 1, color: [120, 250, 255] }),
  bashful:     shape({ h: .85, lidL: .12, lidR: .12, happy: .3, sparkle: 1, color: [150, 225, 255] }),
  dozy:        shape({ h: .85, lidL: .5, lidR: .5, happy: .35, sparkle: .5 }),
  curious:     shape({ w: 1.12, h: 1.18, tilt: -.1, color: [120, 250, 255] }),
  grumpy:      shape({ h: .75, lidL: .3, lidR: .3, tilt: .5, color: [255, 120, 90] }),
  sulk:        shape({ h: .8, lidL: .35, lidR: .35, tilt: -.2, color: [140, 170, 200] }),
  aww:         shape({ h: .9, lidL: .2, lidR: .2, tilt: -.45, color: [110, 190, 230] }),
  dizzy:       shape({ w: 1.05, h: 1.05, spiral: 1, color: [255, 225, 110] }),
  groove:      shape({ w: 1.05, h: .95, happy: .35, color: [120, 255, 200] }),
  reading:     shape({ w: .92, h: .74, lidL: .12, lidR: .12, glasses: 1 }),
  meeting:     shape({ w: .88, h: .82, lidL: .08, lidR: .08, color: [150, 200, 255] }),
  drowsy:      shape({ lidL: .32, lidR: .32, tilt: -.15, color: [80, 190, 235] }),
  focused:     shape({ w: 1.05, h: .8, lidL: .2, lidR: .2, tilt: .2 }),
  sleepy:      shape({ lidL: .55, lidR: .55, tilt: -.25, color: [70, 170, 220] }),
  sleeping:    shape({ w: 1.05, h: .08, color: [60, 120, 200] }),
  stressed:    shape({ w: .9, h: 1.05, lidL: .1, lidR: .1, tilt: -.5, color: [255, 170, 70] }),
  suspicious:  shape({ h: .9, lidL: .55, lidR: .15, tilt: .3, color: [190, 140, 255] }),
  surprised:   shape({ w: 1.2, h: 1.25, color: [130, 255, 230] }),
  lost:        shape({ w: .8, h: .8, lidL: .3, lidR: .3, tilt: -.3, color: [90, 110, 130] }),
  // Short poses used by quirks.
  sneezeIn:    shape({ h: .9, lidL: .4, lidR: .4, tilt: -.3 }),
  squint:      shape({ w: 1.15, h: .1 }),
  stretchUp:   shape({ w: .8, h: 1.45 }),
  stretchWide: shape({ w: 1.3, h: .7, happy: .3 }),
};

// Every buddy is born with one personality (chosen on the PC, so it stays the same).
const TRAITS = {
  cheerful: { happyChance: .7, grumpyAt: 9, quirkEvery: 1,   bounce: 1,   dizzyAt: 16, sleepyAfter: 120, frown: 0 },
  shy:      { happyChance: .3, grumpyAt: 7, quirkEvery: 1.3, bounce: .8,  dizzyAt: 16, sleepyAfter: 120, frown: 0, shy: true },
  hyper:    { happyChance: .6, grumpyAt: 6, quirkEvery: .5,  bounce: 1.5, dizzyAt: 9,  sleepyAfter: 180, frown: 0, hyper: true },
  sleepy:   { happyChance: .4, grumpyAt: 6, quirkEvery: 1,   bounce: .8,  dizzyAt: 16, sleepyAfter: 60,  frown: 0, sleepy: true },
  grumpy:   { happyChance: .2, grumpyAt: 4, quirkEvery: 1.2, bounce: 1,   dizzyAt: 14, sleepyAfter: 120, frown: .15, sweet: true },
};
const PERSONALITY_NAMES = { cheerful: 'Cheerful 😊', shy: 'Shy 😳', hyper: 'Hyper ⚡', sleepy: 'Sleepy 😴', grumpy: 'Grumpy-but-sweet 😤' };
const UNLOCKS = { 2: "I'll wave when you come back 👋", 3: 'I might doze off when you pet me 😌',
                  4: "I'll celebrate your long focus sessions 🎉", 5: 'Best friends forever 💙' };
const FUN_LINES = ['Hmm… is this work? 👀', 'I see you…', 'Just one video, right? 🍿', 'Taking a little break? 😏'];
const BED_LINES = ["It's getting late… 🌙", 'Bedtime soon? 😴', 'Your pillow misses you 🛏️', 'Sleepy… are you sleepy too? 🥱'];
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const store = {
  get: k => { try { return localStorage.getItem('deskbuddy.' + k); } catch (e) { return null; } },
  set: (k, v) => { try { localStorage.setItem('deskbuddy.' + k, v); } catch (e) {} },
};

// ---------- voice: little chirps and beeps, made on the fly (no words) ----------
let ac = null, soundOn = store.get('sound') !== 'off';
const quiet = () => mood === 'meeting' || baseMood === 'meeting';   // never beep during a meeting
function audio() {
  if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; } }
  if (ac.state === 'suspended') ac.resume();
  return ac;
}
// Every sound is a list of notes and noise bursts. Played here, and/or sent to the PC to play the same way.
let outbox = null, forcePhone = false;
function emit(ev) {
  if (!forcePhone && (!soundOn || quiet())) return;
  const out = forcePhone || DEMO ? 'phone' : P('soundOutput');
  if (out === 'phone' || out === 'both') (ev.k === 'noise' ? playNoise : playTone)(ev);
  if (out === 'pc' || out === 'both') {
    if (!outbox) {   // gather the notes of one sound into a single message
      outbox = [];
      queueMicrotask(() => {
        const events = outbox; outbox = null;
        fetch('sound', { method: 'POST', body: JSON.stringify({ events }) }).catch(() => {});
      });
    }
    outbox.push(ev);
  }
}
function tone(f0, f1, dur, { type = 'sine', vol = .12, delay = 0, vib = 0, trem = 0 } = {}) {
  emit({ k: 'tone', f0, f1, dur, type, vol, delay, vib, trem });
}
function noise(dur, vol, freq, delay = 0) {
  emit({ k: 'noise', dur, vol, freq, delay });
}
function playTone({ f0, f1, dur, type, vol, delay, vib, trem }) {
  const a = audio();
  if (!a) return;
  vol *= P('volume') / 100;
  if (vol < .0002) return;
  const t = a.currentTime + delay, o = a.createOscillator(), g = a.createGain();
  o.type = type;
  o.frequency.setValueAtTime(f0, t);
  o.frequency.exponentialRampToValueAtTime(f1, t + dur);
  g.gain.setValueAtTime(.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + Math.min(.03, dur / 3));
  g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  o.connect(g).connect(a.destination);
  const wobble = (rate, depth, target) => {
    const l = a.createOscillator(), lg = a.createGain();
    l.frequency.value = rate; lg.gain.value = depth;
    l.connect(lg).connect(target); l.start(t); l.stop(t + dur + .05);
  };
  if (vib) wobble(vib, f0 * .05, o.frequency);   // wavering pitch
  if (trem) wobble(trem, vol * .8, g.gain);      // fluttering volume (purr)
  o.start(t); o.stop(t + dur + .05);
}
function playNoise({ dur, vol, freq, delay }) {
  const a = audio();
  if (!a) return;
  vol *= P('volume') / 100;
  if (vol < .0002) return;
  const t = a.currentTime + delay, buf = a.createBuffer(1, Math.ceil(a.sampleRate * dur), a.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
  const src = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
  src.buffer = buf; f.type = 'bandpass'; f.frequency.value = freq;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  src.connect(f).connect(g).connect(a.destination); src.start(t);
}
const sfx = {
  chirp:    () => { tone(700, 1100, .07); tone(900, 1400, .09, { delay: .08 }); },
  giggle:   () => { for (let i = 0; i < 4; i++) tone(950 + Math.random() * 250, 1450, .05, { delay: i * .08, vol: .08 }); },
  laugh:    () => { for (let i = 0; i < 10; i++) tone(1000 + Math.random() * 300, 1500 - i * 30, .05, { delay: i * .09, vol: .08 }); },
  hmph:     () => { tone(260, 170, .2, { type: 'square', vol: .035 }); noise(.12, .05, 700); },
  purr:     () => tone(90, 85, .45, { type: 'sawtooth', vol: .03, trem: 24 }),
  curious:  () => tone(480, 900, .2, { vol: .1 }),
  hmm:      () => { tone(420, 540, .12, { vol: .08 }); tone(540, 380, .18, { delay: .14, vol: .08 }); },
  sad:      () => tone(520, 290, .45, { type: 'triangle', vol: .09 }),
  surprise: () => tone(380, 1300, .14, { vol: .11 }),
  yawn:     () => tone(520, 200, .9, { type: 'triangle', vol: .07, vib: 5 }),
  ah:       h => tone(300 * h, 460 * h, .35, { type: 'triangle', vol: .06 }),
  achoo:    () => { noise(.28, .2, 2600); tone(900, 280, .16, { type: 'square', vol: .04 }); },
  hic:      () => tone(650, 1150, .05, { type: 'square', vol: .045 }),
  note:     f => tone(f, f * 1.01, .32, { type: 'triangle', vol: .07, vib: 6 }),
  dizzy:    () => tone(720, 240, 1.1, { vol: .08, vib: 9 }),
  snore:    () => { tone(110, 150, 1, { type: 'sawtooth', vol: .012 }); noise(1, .012, 450); },
  morning:  () => [523, 659, 784, 1047].forEach((f, i) => tone(f, f, .16, { delay: i * .11, vol: .08, type: 'triangle' })),
  ding:     () => { tone(1320, 1320, .14, { vol: .09 }); tone(1760, 1760, .3, { delay: .13, vol: .09 }); },
  bell:     () => [0, .22, .44].forEach(d => tone(1568, 1568, .2, { delay: d, vol: .08, type: 'triangle' })),
  page:     () => noise(.18, .025, 3000),
};

// ---------- connection to the PC ----------
let state = { x: 0, y: 0, cpu: 0, ram: 0, idle: 0, title: '', work: 0, audio: 0, media: null, mail: null, calendar: null, buddy: null, prefs: null, ping: 0 };
let lastPing = null;
let lastMsg = -1e9, lastMove = -1e9, cpuS = 0, px = 0, py = 0;
let spin = 0, lastAng = null;                       // for "spin the mouse and it gets dizzy"
let audioAvg = 0, musicSince = 0, lastBeat = 0;     // for dancing to music
const trait = () => TRAITS[state.buddy && state.buddy.personality] || TRAITS.cheerful;
const level = () => (state.buddy && state.buddy.level) || 1;

function onState(s) {
  const now = performance.now(), vx = s.x - px, vy = s.y - py;
  if (Math.abs(vx) + Math.abs(vy) > 0.002) lastMove = now;
  px = s.x; py = s.y;
  cpuS += (s.cpu - cpuS) * 0.02;   // smoothed so short spikes don't stress it out
  state = s; lastMsg = now;
  if (lastPing !== null && s.ping > lastPing) {   // "Test on phone" from the dashboard
    forcePhone = true; sfx.chirp(); forcePhone = false;
    setOverride('happy', 1200); bounceV = -3;
  }
  lastPing = s.ping;

  // Add up how far the cursor's direction turns; a few fast circles in a row = dizzy.
  if (Math.hypot(vx, vy) > 0.012) {
    const a = Math.atan2(vy, vx);
    if (lastAng !== null) spin = spin * .97 + (((a - lastAng) + Math.PI * 3) % (Math.PI * 2) - Math.PI);
    lastAng = a;
  } else { spin *= .85; lastAng = null; }
  if (Math.abs(spin) > trait().dizzyAt) { spin = 0; if (rateOk('dizzy', 8000)) getDizzy(); }

  // Music: steady sound for a few seconds (or a song playing in Spotify/YouTube). A beat is a spike.
  const lvl = s.audio || 0;
  audioAvg += (lvl - audioAvg) * .05;
  musicSince = audioAvg > .04 ? (musicSince || now) : 0;
  if (lvl > audioAvg * 1.35 + .04 && now - lastBeat > 280) beat(now);
}
const connected = now => now - lastMsg < 3000;
const songPlaying = () => !!(state.media && state.media.playing);
const musicPlaying = now => P('music') && ((songPlaying() && audioAvg > .015) || (musicSince && now - musicSince > 3000));
const tellPC = kind => { if (!DEMO) fetch('bond', { method: 'POST', body: kind }).catch(() => {}); };

// Demo mode (face.html?demo) for the website: no PC needed. The page around it sends
// {x, y} to steer the eyes and {mood} to show off a mood or trick.
const DEMO = params.has('demo');
const DEMO_LINES = {
  happy: 'Beep boop! 😊', love: 'Hehe, that tickles! 💕', focused: 'Focus mode 🤓',
  sleepy: '*yawn* 🥱', stressed: 'Phew… CPU at 97% 🥵', meeting: '🤫 Shh… meeting mode',
  suspicious: 'Hmm… is this work? 👀', surprised: "Oh! You're back! 👋",
};
if (DEMO) {
  let demo = { x: 0, y: 0 }, demoSongUntil = 0, demoReadUntil = 0;
  const demoBuddy = { name: params.get('name') || 'Pip', personality: params.get('personality') || 'cheerful',
                      level: +params.get('level') || 3, progress: .4, days: 12, awayDays: 0 };
  addEventListener('message', e => {
    const d = e.data || {}, now = performance.now();
    if (typeof d.x === 'number') demo = { x: clamp(d.x, -1, 1), y: clamp(d.y, -1, 1) };
    if (!d.mood) return;
    cancelQuirk();
    if (d.mood === 'dizzy') getDizzy();
    else if (d.mood === 'song') demoSongUntil = now + 14000;
    else if (d.mood === 'reading') demoReadUntil = now + 14000;
    else if (d.mood === 'mail') announceMail({ count: 1, latest: { from: 'Alex', subject: 'Lunch tomorrow? 🍜' } });
    else if (d.mood === 'event') remind('📅 <b>Team standup</b> in 10 min', false);
    else if (d.mood === 'levelup') levelUp(4);
    else if (QUIRKS[d.mood]) QUIRKS[d.mood]();
    else if (MOODS[d.mood]) {
      setOverride(d.mood, 5000); bounceV = -2.5;
      if (DEMO_LINES[d.mood]) say(DEMO_LINES[d.mood], 2500);
      const voice = { happy: 'chirp', love: 'chirp', giggle: 'giggle', content: 'purr', grumpy: 'hmph', curious: 'curious',
                      suspicious: 'hmm', stressed: 'sad', lost: 'sad', surprised: 'surprise', sleepy: 'yawn', drowsy: 'yawn',
                      sleeping: 'snore', groove: 'chirp', bashful: 'giggle' }[d.mood];
      if (voice) sfx[voice]();
    }
  });
  addEventListener('pointermove', e => demo = { x: e.clientX / innerWidth * 2 - 1, y: e.clientY / innerHeight * 2 - 1 });
  setInterval(() => {
    const now = performance.now(), song = now < demoSongUntil;
    onState({ ...demo, cpu: 12, ram: 45, idle: 0, work: 12, buddy: demoBuddy,
              title: now < demoReadUntil ? 'Paper.pdf - Adobe Acrobat' : '',
              media: song ? { title: 'Sunny Afternoon', artist: 'The Demo Band', playing: true, app: 'Spotify' } : null,
              audio: song ? ((now % 500) < 140 ? .7 : .15) : 0 });
  }, 66);
} else {
  new EventSource('events').onmessage = e => onState(JSON.parse(e.data));
}

// ---------- speech bubble (used sparingly - it mostly talks with its face) ----------
const bubble = $('bubble');
let bubbleTimer = 0;
function say(html, ms) {
  bubble.innerHTML = html;
  bubble.classList.add('show');
  clearTimeout(bubbleTimer);
  if (ms > 0) bubbleTimer = setTimeout(() => reminding ? showReminder() : bubble.classList.remove('show'), ms);
}
const showReminder = () => say(`You've been working ${Math.floor(state.work)} min!<br>Stretch &amp; drink some water 💧<br><small>tap me when done</small>`, 0);

// ---------- mood brain ----------
let baseMood = 'neutral', mood = 'neutral', override = null, reminding = false, breakAck = 0;
let nextHappy = performance.now() + 20000, nextQuirk = performance.now() + 25000, nextGift = performance.now() + 30 * 60000;
let nextBedtime = performance.now() + 60000, nextSnore = 0, greetAfter = performance.now() + 2600;
let focusSince = 0, readStart = 0;
const lastSaid = {};
function rateOk(key, ms) {
  const n = performance.now();
  if ((lastSaid[key] ?? -1e9) + ms > n) return false;
  lastSaid[key] = n; return true;
}
const setOverride = (m, ms) => override = { mood: m, until: performance.now() + ms };
const overridden = (m, now = performance.now()) => override && now < override.until && (!m || override.mood === m);
const lateNight = () => new Date().getHours() < 5;

function onMoodChange(prev, m, now) {
  if (prev === 'focused' && m !== 'focused' && m !== 'sleepy' && m !== 'sleeping' && focusSince && now - focusSince > 25 * 60000 && level() >= 4) {
    QUIRKS.celebrate(); say(`Great focus session! 🎉<br><small>${Math.round((now - focusSince) / 60000)} minutes</small>`, 3500);
  }
  focusSince = m === 'focused' ? now : 0;
  if (m === 'reading') { readStart = now; sfx.hmm(); }

  if (prev === 'lost' && m !== 'lost') { setOverride('happy', 1500); sfx.chirp(); say('Connected! Hi there 👋', 2500); greetAfter = now + 2600; }
  else if (prev === 'sleeping' && m !== 'lost') {
    if (level() >= 2) { QUIRKS.wave(); say("You're back! 👋", 2500); }
    else { setOverride('surprised', 1500); sfx.surprise(); say("Oh! You're back! 👋", 2500); }
  }
  else if (m === 'lost') { sfx.sad(); say('Looking for your PC…<br><small>is Desk Buddy running?</small>', 0); }
  else if (m === 'sleepy') sfx.yawn();
  else if (m === 'meeting' && rateOk('meet', 600000)) say('🤫 Shh… meeting mode', 2500);
  else if (m === 'stressed' && rateOk('cpu', 60000)) { sfx.sad(); say(`Phew… CPU at ${Math.round(cpuS)}% 🥵`, 3000); }
  else if (m === 'suspicious' && rateOk('fun', 180000)) { sfx.hmm(); say(pick(FUN_LINES), 3000); }
}

// The first time it sees you each day: a stretch and a hello (and a proper reunion after days apart).
function checkGreeting(now) {
  if (!greetAfter || now < greetAfter || !connected(now) || state.idle > 30 || !state.buddy) return;
  greetAfter = 0;
  const b = state.buddy, today = new Date().toDateString();
  if (store.get('lastDay') === today) return;
  store.set('lastDay', today);
  const events = state.calendar && state.calendar.today;
  const plan = events ? `<br><small>You have ${events} event${events > 1 ? 's' : ''} today 📅</small>` : '';

// ---------- music, mail, calendar, friendship ----------
let song = '', wasPlaying = false, mailSeq = null, lastLevel = +store.get('level') || 0, sparkleUntil = 0, iconUntil = 0, icon = '';
const reminded = new Set();
function checkMedia(now) {
  const m = state.media, playing = songPlaying(), key = m ? m.title + '|' + m.artist : '';
  if (!P('music')) { wasPlaying = playing; song = key; return; }
  if (playing && m.title && key !== song) {           // a new song started

function announceMail(m) {

  bounceV = -4 * trait().bounce; sfx.ding(); showIcon('✉️', 3500);
  say(`📧 ${m.count > 1 ? `${m.count} new emails · latest from` : 'New email from'} <b>${esc(m.latest.from)}</b><br><small>${esc(m.latest.subject)}</small>`, 6000);
}
function checkMail() {

  if (m.seq > mailSeq) { mailSeq = m.seq; if (m.latest && P('mailAlerts')) announceMail(m); }
}
function remind(html, now) {

  sfx.bell(); showIcon('🔔', 3500); say(html, 7000);
}
function checkCalendar() {
  if (!P('calendarAlerts')) return;
  for (const ev of (state.calendar && state.calendar.events) || []) {
    const mins = (ev.start * 1000 - Date.now()) / 60000, key = ev.title + ev.start;
    if (mins <= 1 && mins > -3 && !reminded.has(key + 'now')) {

    } else if (mins <= 10 && mins > 1 && !reminded.has(key + 'soon')) {

}
function levelUp(n) {

  sfx.morning(); play([200, 600, 1000, 1400].map(ms => [ms, () => bounceV = -4]));
  say(`We're closer now! 💙<br><small>Friendship level ${n}: ${UNLOCKS[n] || ''}</small>`, 5500);
}
function checkBond() {

  else if (b.level > lastLevel) { lastLevel = b.level; store.set('level', b.level); levelUp(b.level); }
  const milestone = [7, 30, 100, 365].filter(d => b.days >= d).pop() || 0, seen = store.get('milestone');
  if (seen === null) store.set('milestone', milestone);          // a new phone: don't replay old milestones
  else if (milestone > +seen) {
    store.set('milestone', milestone);
    setOverride('love', 3000); sparkleUntil = performance.now() + 3000; sfx.chirp();

}
const showIcon = (i, ms) => { icon = i; iconUntil = performance.now() + ms; };

function think(now) {
  let m;
  const title = state.title || '';
  if (!connected(now)) m = 'lost';
  else if (state.idle > 600) m = 'sleeping';
  else if (state.idle > trait().sleepyAfter) m = 'sleepy';
  else if (P('meeting') && MEET_RE.test(title)) m = 'meeting';
  else if (P('stress') && cpuS > 85) m = 'stressed';
  else if (musicPlaying(now)) m = 'groove';
  else if (P('reading') && READ_RE.test(title)) m = 'reading';
  else if (P('suspicious') && FUN_RE.test(title)) m = 'suspicious';
  else if (WORK_RE.test(title)) m = 'focused';
  else if (P('bedtime') && lateNight()) m = 'drowsy';
  else m = 'neutral';
  if (m !== baseMood) { onMoodChange(baseMood, m, now); baseMood = m; }

  if (connected(now)) { checkGreeting(now); checkMedia(now); checkMail(); checkCalendar(); checkBond(); }

  // Break reminder. The PC resets "work" after 5 min away, which also counts as a break.
  if (state.work < breakAck) breakAck = 0;
  const due = P('breaks') && connected(now) && state.work - breakAck >= P('breakMinutes');
  if (due && !reminding && m !== 'sleeping' && m !== 'sleepy' && m !== 'meeting') { reminding = true; sfx.chirp(); showReminder(); }
  if (!due && reminding) { reminding = false; bubble.classList.remove('show'); }

  const calm = (m === 'neutral' || m === 'drowsy' || m === 'focused') && !overridden() && !reminding && !touch && !quirkTimers.length;
  if (calm && P('bedtime') && lateNight() && state.idle < 60 && now > nextBedtime) {
    nextBedtime = now + 20 * 60000;
    setOverride('sleepy', 2000); sfx.yawn(); say(pick(BED_LINES), 3500);
  } else if (calm && level() >= 5 && now > nextGift) {   // best friends: a little heart, just because
    nextGift = now + (30 + Math.random() * 30) * 60000;
    setOverride('love', 2000); showIcon('💙', 2000); sfx.chirp();
  } else if (calm && P('quirks') && now > nextQuirk) {
    nextQuirk = now + (40000 + Math.random() * 60000) * trait().quirkEvery;
    const sleepyNow = lateNight() || m === 'drowsy' || trait().sleepy;
    QUIRKS[sleepyNow ? pick(['nodOff', 'nodOff', 'sneeze', 'hum']) : pick(['sneeze', 'hiccup', 'fly', 'fly', 'hum', 'nodOff'])]();
  } else if (m === 'neutral' && calm && now > nextHappy) {
    nextHappy = now + 20000 + Math.random() * 25000;
    if (Math.random() < trait().happyChance) { setOverride('happy', 1600); if (Math.random() < .5) sfx.chirp(); }
  }

  const next = overridden(null, now) ? override.mood : (reminding ? 'happy' : m);
  if (next !== mood) { mood = next; updateGlow(); }
}

// ---------- quirks: little things it does on its own ----------
let quirkTimers = [], flyStart = -1e9, humUntil = 0, lookHold = null, swing = 1, grumpySide = 1;
function play(steps) {
  for (const [ms, fn] of steps) quirkTimers.push(setTimeout(fn, ms));
  quirkTimers.push(setTimeout(() => quirkTimers = [], Math.max(...steps.map(s => s[0])) + 50));
}
function cancelQuirk() { quirkTimers.forEach(clearTimeout); quirkTimers = []; flyStart = -1e9; humUntil = 0; lookHold = null; }
const hold = (x, y, ms) => lookHold = { x, y, until: performance.now() + ms };

const QUIRKS = {
  sneeze: () => play([
    [0,    () => { setOverride('sneezeIn', 1400); hold(0, -.5, 1400); sfx.ah(1); }],
    [650,  () => sfx.ah(1.25)],
    [1350, () => { setOverride('squint', 450); hold(0, .4, 450); bounceV = 6; sfx.achoo(); }],
    [1800, () => setOverride('surprised', 500)],
    [2300, () => { setOverride('happy', 900); sfx.giggle(); }],
  ]),
  hiccup: () => play([0, 800, 1600, 2400].map(ms => [ms, () => { setOverride('surprised', 260); bounceV = -4; sfx.hic(); }])
    .concat([[3000, () => setOverride('content', 900)]])),
  fly: () => play([
    [0,    () => flyStart = performance.now()],
    [4300, () => { setOverride('focused', 500); bounceV = -5; sfx.hmm(); }],   // tries to catch it...
    [4900, () => { setOverride('surprised', 700); sfx.surprise(); }],         // ...and it zooms away
    [6000, () => { flyStart = -1e9; setOverride('happy', 800); }],
  ]),
  hum: () => {

    setOverride('content', 5000);

  nodOff: () => play([

    [2800, () => { setOverride('surprised', 700); bounceV = -6; sfx.surprise(); }],   // whoa, I'm awake!
    [3500, () => { setOverride('happy', 800); sfx.giggle(); }],
  ]),
  stretch: () => play([
    [0,    () => { setOverride('stretchUp', 800); bounceV = -3; sfx.yawn(); }],
    [800,  () => setOverride('stretchWide', 600)],
    [1400, () => { setOverride('happy', 1500); sfx.morning(); }],
  ]),
  wave: () => {

    play([0, 300, 600, 900, 1200].map((ms, i) => [ms, () => { setOverride('happy', 400); hold(i % 2 ? .5 : -.5, -.1, 320); bounceV = -2.5; }]));
  },
  celebrate: () => {

    play([0, 350, 700, 1050, 1400, 1750].map((ms, i) => [ms, () => { setOverride('giggle', 500); hold(i % 2 ? .4 : -.4, -.2, 340); bounceV = -4; }]));

function getDizzy() {
  cancelQuirk(); setOverride('dizzy', 3500); sfx.dizzy();
  play([[3500, () => { setOverride('content', 800); }]]);
}

let beats = 0;
function beat(now) {
  lastBeat = now;
  if (mood !== 'groove') return;
  swing = -swing; bounceV -= 2.2 * trait().bounce;
  if (++beats % 4 === 0) blinkStart = now;   // eyes close on the beat now and then, really feeling it
}

// Where the fly is (-1..1 screen space): buzzes around, then zooms off at the end.
function flyPos(now) {
  const t = (now - flyStart) / 1000;
  return {
    x: .75 * Math.sin(t * 1.7) * Math.cos(t * .6) + Math.sin(t * 13) * .03 + Math.max(0, t - 4.9) * 2.5,
    y: -.45 + .3 * Math.sin(t * 2.3 + 1) + Math.cos(t * 11) * .03 - Math.max(0, t - 4.9) * 1.2,
  };
}

// Reading: eyes sweep along a line, drop to the next, and turn the page every 8 lines.
const LINE_MS = 2400;
function readingLook(now) {
  const t = now - readStart, line = Math.floor(t / LINE_MS), p = (t % LINE_MS) / LINE_MS;
  if (line > 0 && line % 8 === 0 && p < .03 && rateOk('page', 1000)) { sfx.page(); blinkStart = now; }
  return { x: p < .85 ? -.55 + p / .85 * 1.1 : .55 - (p - .85) / .15 * 1.1, y: -.25 + (line % 8) * .07 };
}

// ---------- drawing ----------
let W, H, S, faceTilt = 0;
const cur = { ...MOODS.neutral }, col = [...MOODS.neutral.color];
const look = { x: 0, y: 0 }; let lookT = { x: 0, y: 0 }, nextSaccade = 0;
let blinkStart = -1e9, nextBlink = 0, bounce = 0, bounceV = 0, hudOn = true;

function resize() {
  const dpr = Math.min(devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = W * dpr; cv.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  S = Math.min(W * 0.2, H * 0.42);
  updateGlow();
}
function updateGlow() {
  const [r, g, b] = MOODS[mood].color;
  cv.style.filter = `drop-shadow(0 0 ${Math.round(S * 0.07)}px rgba(${r},${g},${b},.75))`;
  document.documentElement.style.setProperty('--eye', `rgb(${r},${g},${b})`);
}

function roundRect(x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function drawEye(cx, cy, w, h, lid, tilt, happy, sparkle, isLeft, color) {
  ctx.save();
  roundRect(cx - w / 2, cy - h / 2, w, h, Math.min(w, h) * 0.3);
  ctx.clip();
  ctx.fillStyle = color;
  ctx.fillRect(cx - w / 2 - 1, cy - h / 2 - 1, w + 2, h + 2);
  if (sparkle > .02) {   // glossy highlights: a big shine and a small one, like happy cartoon eyes
    const r = Math.min(w, Math.max(h, S * .3)) * .14;
    ctx.globalAlpha = .9 * sparkle; ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(cx - w * .2, cy - h * .2, r, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(cx + w * .1, cy - h * .02, r * .45, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;
  }
  ctx.fillStyle = '#000';
  // Top lid: a slanted cut. Inner corner drops when angry, outer corner when worried.
  const top = cy - h / 2, L = cx - w / 2 - 2, R = cx + w / 2 + 2;
  const inner = lid + Math.max(0, tilt) * .5, outer = lid + Math.max(0, -tilt) * .5;
  ctx.beginPath();
  ctx.moveTo(L, top - 2); ctx.lineTo(R, top - 2);
  ctx.lineTo(R, top + (isLeft ? inner : outer) * h);
  ctx.lineTo(L, top + (isLeft ? outer : inner) * h);
  ctx.fill();
  // Happy: a big circle bites the bottom off, leaving a ^ shape.
  if (happy > 0.01) {
    const rr = w * 0.75;
    ctx.beginPath(); ctx.arc(cx, cy + h / 2 + rr - happy * h, rr, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
}

function drawStar(x, y, r, alpha) {   // a four-pointed twinkle
  ctx.globalAlpha = alpha; ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.moveTo(x, y - r);
  ctx.quadraticCurveTo(x, y, x + r, y); ctx.quadraticCurveTo(x, y, x, y + r);
  ctx.quadraticCurveTo(x, y, x - r, y); ctx.quadraticCurveTo(x, y, x, y - r);
  ctx.fill(); ctx.globalAlpha = 1;
}

function drawGlasses(cx, cy, gap, amount) {
  const R = S * .56, y = cy - (1 - amount) * S * .9;   // they slide down onto its face
  ctx.save();
  ctx.globalAlpha = amount;
  ctx.lineWidth = S * .045; ctx.strokeStyle = 'rgba(235,248,255,.95)'; ctx.fillStyle = 'rgba(200,240,255,.07)';
  for (const side of [-1, 1]) {
    ctx.beginPath(); ctx.arc(cx + side * gap, y, R, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx + side * (gap + R), y - S * .05); ctx.lineTo(cx + side * (gap + R + S * .22), y - S * .14); ctx.stroke();
    ctx.lineWidth = S * .025;   // a little glint on each lens
    ctx.beginPath(); ctx.arc(cx + side * gap, y, R * .72, Math.PI * 1.1, Math.PI * 1.4); ctx.stroke();
    ctx.lineWidth = S * .045;
  }
  ctx.beginPath(); ctx.moveTo(cx - gap + R, y - S * .05); ctx.quadraticCurveTo(cx, y - S * .2, cx + gap - R, y - S * .05); ctx.stroke();
  ctx.restore();
}

function drawSpiral(cx, cy, size, dir, now, color) {
  ctx.save();
  ctx.strokeStyle = color; ctx.lineWidth = S * .055; ctx.lineCap = 'round';
  ctx.beginPath();
  const rot = now / 140 * dir, steps = 120, turns = 3;
  for (let i = 0; i <= steps; i++) {
    const a = i / steps * turns * Math.PI * 2 + rot, r = size * i / steps;
    const x = cx + Math.cos(a) * r, y = cy + Math.sin(a) * r;
    i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  }
  ctx.stroke();
  ctx.restore();
}

function floaty(text, x, y, size, alpha, color) {
  ctx.globalAlpha = alpha; ctx.fillStyle = color;
  ctx.font = `bold ${size}px system-ui, sans-serif`; ctx.textAlign = 'center';
  ctx.fillText(text, x, y); ctx.globalAlpha = 1;
}

function draw(now, blink) {
  ctx.clearRect(0, 0, W, H);
  const color = `rgb(${col.map(Math.round)})`;
  ctx.save();
  const rot = Math.sin(now / 180) * .12 * cur.spiral + faceTilt;   // dizzy wobble, or swaying to music
  if (rot) { ctx.translate(W / 2, H / 2); ctx.rotate(rot); ctx.translate(-W / 2, -H / 2); }
  const jitter = mood === 'stressed' ? S * 0.012 : 0;
  const breathe = (mood === 'sleeping' || mood === 'sleepy' || mood === 'dozy') ? Math.sin(now / 900) * S * .04 : 0;
  const wobble = Math.sin(now / 120) * S * .08 * cur.spiral;
  const cx = W / 2 + look.x * S * .45 + (Math.random() - .5) * jitter + wobble;
  const cy = H / 2 + look.y * S * .3 + breathe + bounce * S * .5 - (hudOn ? S * .06 : 0);
  const gap = S * .72;
  const sparkle = Math.max(cur.sparkle, now < sparkleUntil ? 1 : 0);
  for (const side of [-1, 1]) {
    const persp = 1 + side * look.x * .07;   // eye nearer the look direction gets a bit bigger
    const w = S * .78 * cur.w * persp;
    const h = Math.max(S * cur.h * persp * blink, S * .05);
    const ex = cx + side * gap;
    if (cur.spiral > .5) drawSpiral(ex, cy, Math.min(w, h) * .5, side, now, color);
    else drawEye(ex, cy, w, h, side < 0 ? cur.lidL : cur.lidR, cur.tilt, cur.happy, sparkle * Math.min(1, blink * 1.2), side < 0, color);
  }
  if (cur.glasses > .02) drawGlasses(W / 2 + look.x * S * .12, cy, gap, cur.glasses);
  if (sparkle > .05) {   // twinkles around its face
    const spots = [[-1.55, -.55], [1.6, -.4], [-1.2, .7], [1.3, .65], [0, -.85]];
    spots.slice(0, now < sparkleUntil ? 5 : 3).forEach(([dx, dy], i) => {
      const tw = .5 + .5 * Math.sin(now / 180 + i * 2.1);
      drawStar(cx + dx * gap, cy + dy * S, S * (.07 + .07 * tw) * sparkle, sparkle * (.4 + .6 * tw));
    });
  }
  const rx = cx + gap, top = cy - S / 2;

  if (mood === 'sleeping' || (mood === 'dozy' && now % 3000 < 1500)) {
    for (let i = 0; i < 3; i++) {
      const p = (now / 2200 + i / 3) % 1;
      floaty('z', rx + S * .45 + p * S * .5, cy - S * .15 - p * S * .8, S * (.16 + p * .16), Math.sin(p * Math.PI), color);
    }
  } else if (mood === 'stressed') {
    const p = (now / 1400) % 1, d = S * .07, x = rx + S * .5, y = top + p * S * .5;
    ctx.globalAlpha = Math.sin(p * Math.PI); ctx.fillStyle = 'rgb(120,200,255)';
    ctx.beginPath(); ctx.moveTo(x, y - d * 1.4);
    ctx.bezierCurveTo(x + d, y - d * .2, x + d * .7, y + d, x, y + d);
    ctx.bezierCurveTo(x - d * .7, y + d, x - d, y - d * .2, x, y - d * 1.4);
    ctx.fill(); ctx.globalAlpha = 1;
  } else if (mood === 'love') {
    for (let i = 0; i < 4; i++) {
      const p = (now / 1600 + i / 4) % 1;
      floaty('♥', W / 2 + Math.sin(i * 2.3 + p * 4) * S * 1.3, cy + S * .7 - p * S * 1.4, S * .22, Math.sin(p * Math.PI), color);
    }
  } else if (mood === 'grumpy') {
    floaty('💢', cx + grumpySide * gap * 1.6, top, S * .3, .9, color);
  } else if (mood === 'meeting') {
    floaty('🤫', rx + S * .62, top + S * .1, S * .26, .55, color);
  } else if (mood === 'lost') {
    floaty('?', rx + S * .55, top, S * .35, .5 + .5 * Math.sin(now / 400), color);
  }
  if (mood === 'groove' || now < humUntil) {
    for (let i = 0; i < 3; i++) {
      const p = (now / 1800 + i / 3) % 1, side = i % 2 ? 1 : -1;
      floaty(i % 2 ? '♪' : '♫', cx + side * gap * (1.5 + p * .3), cy - p * S * 1.1, S * .26, Math.sin(p * Math.PI), color);
    }
  }
  if (now < iconUntil) {   // ✉️ 🔔 👋 🎉 💙 bobbing up beside its head (clear of the speech bubble)
    const p = 1 - (iconUntil - now) / 3500;
    floaty(icon, rx + S * .78, cy - S * .05 - p * S * .35 + Math.sin(now / 160) * S * .04, S * .38, Math.min(1, (iconUntil - now) / 500), color);
  }
  ctx.restore();

  if (now - flyStart < 6000) {   // the fly, drawn outside the wobble
    const f = flyPos(now), x = W / 2 + f.x * W * .45, y = H / 2 + f.y * H * .4, r = S * .05;
    ctx.fillStyle = 'rgba(225,240,255,.6)';   // flapping wings
    for (const s of [-1, 1]) {
      ctx.beginPath(); ctx.ellipse(x + s * r, y - r * .8, r * 1.1, r * (Math.sin(now / 15) > 0 ? .5 : .25), s * .5, 0, Math.PI * 2); ctx.fill();
    }
    ctx.fillStyle = '#16232b'; ctx.strokeStyle = '#d6e4ea'; ctx.lineWidth = Math.max(1.5, r * .25);   // dark body, light rim: visible on eyes and background
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  }
}

// ---------- main loop ----------
let last = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  think(now);

  // Where to look.
  if (touch) lookT = { x: clamp((touch.lx / W * 2 - 1) * 1.3, -1, 1), y: clamp((touch.ly / H * 2 - 1) * 1.3, -1, 1) };
  else if (mood === 'sleeping' || mood === 'dozy') lookT = { x: 0, y: .15 };
  else if (lookHold && now < lookHold.until) lookT = { x: lookHold.x, y: lookHold.y };
  else if (now - flyStart < 6000) lookT = flyPos(now);
  else if (now < humUntil) lookT = { x: Math.sin(now / 400) * .35, y: -.1 };
  else if (mood === 'reading') lookT = readingLook(now);
  else if (mood === 'groove') lookT = { x: swing * .35, y: -.05 };
  else if (mood === 'grumpy' || mood === 'sulk') lookT = { x: grumpySide * .8, y: .15 };
  else if (mood === 'bashful') lookT = { x: grumpySide * .7, y: .35 };
  else if (reminding || mood === 'surprised' || mood === 'dizzy') lookT = { x: 0, y: 0 };
  else if (mood === 'meeting' && now - lastMove > 1500) lookT = { x: 0, y: .1 };
  else if (connected(now) && now - lastMove < 2500) lookT = { x: clamp(state.x, -1, 1), y: clamp(state.y, -1, 1) };
  else if (now > nextSaccade) {
    nextSaccade = now + (1200 + Math.random() * 3000) * (trait().hyper ? .5 : 1);
    lookT = Math.random() < .35 ? { x: 0, y: 0 } : { x: (Math.random() * 2 - 1) * .7, y: (Math.random() * 2 - 1) * .5 };
  }

  // Holding a finger still on it: it gets curious about your finger.
  if (touch && !touch.petting && now - touch.t > 550) {
    if (!touch.curious) { touch.curious = true; sfx.curious(); }
    setOverride('curious', 300);
  }
  if (DEMO && mood === 'groove' && !songPlaying() && now - lastBeat > 500) beat(now);   // mood-button demo has no music
  if (mood === 'sleeping' && now > nextSnore) { nextSnore = now + 3800; sfx.snore(); }

  const T = MOODS[mood], frown = mood === 'neutral' ? trait().frown : 0;
  const ks = 1 - Math.exp(-dt * 8), kl = 1 - Math.exp(-dt * (mood === 'focused' ? 18 : mood === 'reading' ? 6 : 12));
  for (const k of ['w', 'h', 'lidL', 'lidR', 'happy', 'sparkle', 'spiral', 'glasses']) cur[k] += (T[k] - cur[k]) * ks;
  cur.tilt += (T.tilt + frown - cur.tilt) * ks;
  for (let i = 0; i < 3; i++) col[i] += (T.color[i] - col[i]) * ks;
  look.x += (lookT.x - look.x) * kl; look.y += (lookT.y - look.y) * kl;
  faceTilt += ((mood === 'groove' ? swing * .06 : 0) - faceTilt) * (1 - Math.exp(-dt * 6));

  if (now > nextBlink && mood !== 'sleeping' && mood !== 'dizzy') {
    blinkStart = now;
    nextBlink = now + (Math.random() < .15 ? 260 : 2000 + Math.random() * 4500);
  }
  const bt = (now - blinkStart) / 160;
  const blink = bt < 1 ? 1 - .92 * Math.sin(bt * Math.PI) : 1;

  bounceV += (-140 * bounce - 9 * bounceV) * dt;
  bounce += bounceV * dt;

  draw(now, blink);
  requestAnimationFrame(frame);
}

// ---------- touch: poke, pet, tickle, hold ----------
const installed = matchMedia('(display-mode: fullscreen), (display-mode: standalone)').matches || navigator.standalone;
function keepAwake() {
  // Only allowed on "secure" pages - works once the phone trusts this address (see setup steps).
  if (navigator.wakeLock) navigator.wakeLock.request('screen').catch(() => {});
}
function goFullscreen() {
  const el = document.documentElement;
  const lockLandscape = () => screen.orientation && screen.orientation.lock && screen.orientation.lock('landscape').catch(() => {});
  if (installed || document.fullscreenElement) return lockLandscape();
  const req = el.requestFullscreen || el.webkitRequestFullscreen;
  if (req) Promise.resolve(req.call(el, { navigationUI: 'hide' })).then(lockLandscape, () => {});
}
if (!DEMO) {
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
  keepAwake();
}

let touch = null, pokes = [];
const tickleSpot = { x: .2 + Math.random() * .6, y: .7 + Math.random() * .2 };   // a secret spot, new every time

function poke(x, y) {
  const now = performance.now(), t = trait();
  bounceV = -3.5 * t.bounce;
  if (reminding) {
    reminding = false; breakAck = state.work; tellPC('break');
    setOverride('love', 2200); sfx.chirp(); say('Thanks! Your body says thank you too 💙', 2500);
  } else if (mood === 'sleeping') {
    if (t.sleepy) { setOverride('grumpy', 2000); sfx.hmph(); say('Five more minutes… 😴', 2500); }
    else { setOverride('surprised', 1200); sfx.surprise(); say('Huh?! I was just resting my eyes…', 2500); }
  } else if (Math.hypot(x - tickleSpot.x * W, y - tickleSpot.y * H) < S * .45) {
    setOverride('giggle', 2600); sfx.laugh();   // found the tickle spot!
    play([300, 650, 1000, 1350, 1700].map(ms => [ms, () => bounceV = -4]));
  } else if (overridden('grumpy', now)) {
    setOverride('grumpy', 3000); grumpySide = -grumpySide; sfx.hmph();
  } else {
    pokes = pokes.filter(p => now - p < 6000).concat(now);
    if (pokes.length >= t.grumpyAt) { pokes = []; grumpySide = Math.random() < .5 ? -1 : 1; setOverride('grumpy', 6000); sfx.hmph(); }
    else if (pokes.length >= t.grumpyAt - 2) { setOverride('surprised', 1000); sfx.hmm(); }
    else if (t.shy && Math.random() < .4) { grumpySide = Math.random() < .5 ? -1 : 1; setOverride('bashful', 1400); sfx.giggle(); }
    else if (level() === 1 && Math.random() < .5) { setOverride('surprised', 900); sfx.surprise(); }   // still a bit jumpy with you
    else { setOverride(Math.random() < .25 ? 'love' : 'giggle', 1300); sfx.giggle(); }
  }
}

addEventListener('pointerdown', e => {
  if (e.target.closest('#snd, #bond')) return;
  if (!DEMO) { goFullscreen(); keepAwake(); }
  audio();   // phones only allow sound after the first touch
  cancelQuirk();
  touch = { x: e.clientX, y: e.clientY, lx: e.clientX, ly: e.clientY, t: performance.now(),
            dist: 0, petting: false, petStart: 0, curious: false, forgive: 0, lastPurr: 0 };
});
addEventListener('pointermove', e => {
  if (!touch) return;
  const now = performance.now(), d = Math.hypot(e.clientX - touch.lx, e.clientY - touch.ly);
  touch.lx = e.clientX; touch.ly = e.clientY; touch.dist += d;
  if (touch.dist < 25) return;
  if (!touch.petting) { touch.petting = true; touch.petStart = now; }
  if (overridden('grumpy', now)) {   // petting makes up for the poking
    touch.forgive += d;
    if (touch.forgive > S * 2) { pokes = []; setOverride('love', 1800); sfx.chirp(); touch.forgive = -1e9; }
    return;
  }
  if (!overridden('love', now)) {
    const dozing = level() >= 3 && now - touch.petStart > 4000;   // close friends doze off under your hand
    setOverride(dozing ? 'dozy' : trait().sweet ? 'love' : 'content', 700);
  }
  if (now - touch.lastPurr > 450) { touch.lastPurr = now; sfx.purr(); }
});
function release() {
  if (!touch) return;
  if (touch.curious) { setOverride('happy', 1000); sfx.chirp(); }
  else if (!touch.petting && performance.now() - touch.t < 400) poke(touch.x, touch.y);
  if (touch.petting && touch.dist > S) tellPC('pet');
  touch = null;
}
addEventListener('pointerup', release);
addEventListener('pointercancel', release);
addEventListener('dblclick', () => { hudOn = !hudOn; $('hud').style.display = hudOn ? '' : 'none'; });
document.addEventListener('visibilitychange', () => { if (!document.hidden) keepAwake(); });

// ---------- HUD ----------
const snd = $('snd');
const showSound = () => { snd.textContent = soundOn ? '🔊' : '🔇'; };
snd.addEventListener('pointerdown', e => {
  e.stopPropagation();
  soundOn = !soundOn; store.set('sound', soundOn ? 'on' : 'off'); showSound();
  if (soundOn) sfx.chirp();
});
$('bond').addEventListener('pointerdown', e => {   // tap the 💙 to see your buddy's card
  e.stopPropagation();
  const b = state.buddy;
  if (!b) return;
  const pips = '▰'.repeat(b.level) + '▱'.repeat(5 - b.level);
  say(`<b>${esc(b.name)}</b> · ${PERSONALITY_NAMES[b.personality] || ''}<br><small>Friendship ${pips} level ${b.level} · ${b.days ? `${b.days} day${b.days > 1 ? 's' : ''} together` : 'met today'}</small>`, 4500);
  setOverride('happy', 1200); sfx.chirp();
});
showSound();
setInterval(() => {
  const d = new Date();
  $('clock').textContent = d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  $('cpu').style.width = clamp(state.cpu, 0, 100) + '%';
  $('ram').style.width = clamp(state.ram, 0, 100) + '%';
  $('work').textContent = `⏱ ${Math.floor(state.work)}m`;
  $('mailc').textContent = state.mail ? `✉ ${state.mail.unread}` : '';
  const next = state.calendar && state.calendar.events.find(e => e.start * 1000 > Date.now());
  $('next').textContent = next ? `📅 ${new Date(next.start * 1000).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}` : '';
  $('bond').textContent = state.buddy ? `💙 Lv${state.buddy.level}` : '';
}, 1000);

addEventListener('resize', resize);
resize();
requestAnimationFrame(frame);
</script>
