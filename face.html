  const dx = -g.x * flip, dy = -g.y * flip, a = ((screen.orientation && screen.orientation.angle) || window.orientation || 0) * Math.PI / 180;
  const sx = dx * Math.cos(a) - dy * Math.sin(a), sy = -dx * Math.sin(a) - dy * Math.cos(a);
  // Tilt is measured against how the phone usually rests, which it slowly gets used to.
  sensor.baseX += (sx - sensor.baseX) * .004; sensor.baseY += (sy - sensor.baseY) * .004;
  sensor.tiltX = clamp((sx - sensor.baseX) / 5, -1, 1); sensor.tiltY = clamp((sy - sensor.baseY) / 5, -1, 1);
  // Lying flat on its back: gravity goes straight through the screen.
  const flatNow = Math.abs(g.z) > 9 && Math.hypot(g.x, g.y) < 2.5;
  sensor.flatSince = flatNow ? (sensor.flatSince || now) : 0;
  sensor.flat = flatNow && now - sensor.flatSince > 2500;
  // Shaking: sudden jolts, several in a row.
  if (sensor.last) {
    const jolt = Math.hypot(g.x - sensor.last.x, g.y - sensor.last.y, g.z - sensor.last.z);
    if (jolt > 14) sensor.hits = sensor.hits.filter(t => now - t < 900).concat(now);
    if (sensor.hits.length >= 3 && rateOk('shake', 3500)) {
      const strength = sensor.hits.length; sensor.hits = [];
      cancelQuirk(); setOverride('dizzy', Math.min(6000, 1800 + strength * 400)); sfx.dizzy();
      play([[Math.min(6000, 1800 + strength * 400), () => { setOverride('content', 900); say('Whoa… the room is spinning 😵', 2200, 'sad'); }]]);
    }
  }
  sensor.last = { x: g.x, y: g.y, z: g.z };
}

async function enableMotion() {   // iPhones ask permission once, and only right after a tap

  if (IOS && typeof DeviceMotionEvent.requestPermission === 'function') {
    try { if (await DeviceMotionEvent.requestPermission() !== 'granted') { sensor.motion = 'denied'; reportCaps(); return; } }
    catch (e) { return; }

// Two sharp claps within a second wake it up (or make it jump).

  let peak = 0, sum = 0;
  for (const v of micBuf) { peak = Math.max(peak, Math.abs(v)); sum += v * v; }

  if (peak > .45 && rms > micLevel * 5 + .04 && now - lastLoud > 120) {
    lastLoud = now;

    if (claps.length >= 2 && rateOk('clap', 2000)) { claps = []; onDoubleClap(); }
  }
}

// ---------- your work pattern: it notices how your day is going ----------
const hhmm = m => new Date(2000, 0, 1, Math.floor(m / 60), m % 60).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
const dur = m => m >= 60 ? `${Math.floor(m / 60)} h${m % 60 ? ` ${m % 60} min` : ''}` : `${m} min`;
let praised = { key: null, step: 0 };
function checkPatterns(now) {
  const a = state.activity, d = state.day;
  if (!P('patterns') || !a || !d || overridden() || tool || mood === 'meeting') return;
  const today = new Date().toDateString(), minute = new Date().getHours() * 60 + new Date().getMinutes();
  // Long stretches of real work get a cheer (45 min, 1.5 h, 2.5 h, 4 h).
  if (a.key !== praised.key || a.minutes < 1) praised = { key: a.key, step: 0 };
  const steps = [45, 90, 150, 240];
  if (a.productive && praised.step < steps.length && a.minutes >= steps[praised.step]) {
    const m = steps[praised.step++];
    setOverride('happy', 1800); sparkleUntil = now + 1800;
    say(`${dur(m)} of ${a.label.toLowerCase()}! 💪${m >= 90 ? '<br><small>maybe stretch a little?</small>' : ''}`, 3500, 'excited');
    return;
  }
  // Lots of jumping between different kinds of things.
  if (a.switches10 >= 14 && rateOk('switching', 1800000)) {
    setOverride('dizzy', 1500);
    say("You're jumping between lots of things… 🌀<br><small>hold me for a focus session?</small>", 4500, 'question');
    return;
  }
  // Early or late start compared with your usual day (once a day, once it knows your pattern).
  if (d.usualStart != null && d.first != null && store.get('startNote') !== today && state.idle < 60 && minute - d.first < 90) {
    store.set('startNote', today);
    const diff = d.first - d.usualStart;
    if (diff < -45) { setOverride('surprised', 1200); say(`You're early today! ☀️<br><small>you usually start around ${hhmm(d.usualStart)}</small>`, 4000, 'excited'); return; }
    if (diff > 60) { say(`Late start today 😴<br><small>you usually start around ${hhmm(d.usualStart)}</small>`, 4000, 'calm'); return; }
  }
  // Working well past your usual finishing time.
  if (d.usualEnd != null && minute > d.usualEnd + 60 && state.idle < 60 && store.get('lateNote') !== today) {
    store.set('lateNote', today);

}
// When you step away at the end of your day: a little summary of what you did.
function daySummary() {
  const d = state.day, today = new Date().toDateString(), minute = new Date().getHours() * 60 + new Date().getMinutes();
  if (!P('patterns') || !d || d.activeMin < 60 || store.get('summaryDay') === today) return;
  if (minute < (d.usualEnd != null ? d.usualEnd - 30 : 17 * 60)) return;

// ---------- tools started from the PC dashboard ----------
function runToolCommand({ action, minutes, show }) {
  const now = Date.now(), t = kit.timer, w = kit.watch, p = kit.pomo, d = kit.dice;
  const open = name => { if (show && tool !== name) startTool(name); };
  if (action === 'timer.start') {
    t.minutes = clamp(minutes || t.minutes, 1, 180); t.done = false; t.alarmUntil = 0;
    t.total = t.minutes * 60000; t.end = now + t.total; t.pausedLeft = 0; timerPauses = 0;
    open('timer'); say(`⏳ ${t.minutes} min. Go!`, 1800, false); sfx.chirp();
  } else if (action === 'timer.pause' && t.end) { t.pausedLeft = t.end - now; t.end = 0; }
  else if (action === 'timer.resume' && t.pausedLeft) { t.end = now + t.pausedLeft; t.pausedLeft = 0; }
  else if (action === 'timer.cancel') { t.end = t.pausedLeft = 0; t.done = false; t.alarmUntil = 0; }
  else if (action === 'watch.start') { if (!w.start) w.start = now; open('watch'); }
  else if (action === 'watch.stop' && w.start) { w.acc += now - w.start; w.start = 0; }
  else if (action === 'watch.reset') { w.start = 0; w.acc = 0; }
  else if (action === 'pomo.start') { pomoStart('focus'); open('pomo'); say('🍅 25 minutes of focus. You got this!', 2500, 'calm'); }
  else if (action === 'pomo.pause' && p.end) { p.pausedLeft = p.end - now; p.end = 0; }
  else if (action === 'pomo.resume' && p.pausedLeft) { p.end = now + p.pausedLeft; p.pausedLeft = 0; }
  else if (action === 'pomo.skip') pomoNext();
  else if (action === 'pomo.stop') { p.end = p.pausedLeft = 0; p.round = 1; p.phase = 'focus'; }
  else if (action === 'breathe.start') startTool('breathe');
  else if (action === 'dice.roll') { d.mode = 'dice'; if (tool !== 'dice') startTool('dice'); roll(); }
  else if (action === 'coin.flip') { d.mode = 'coin'; if (tool !== 'dice') startTool('dice'); roll(); }
  else if (action === 'clock.show') startTool('clock');
  else if (action === 'tool.close' && tool) endTool();
  reportTools();
}
// Tell the PC what the tools are doing, so the dashboard can show them live.
function reportTools() {

  const t = kit.timer, w = kit.watch, p = kit.pomo, d = kit.dice;

function drawSpinner(x, y, now, dir, color) {
  const n = 8, r = S * .3;
  for (let i = 0; i < n; i++) {

// ---------- the world around you: sky, weather, seasons, holidays and payday ----------
const life = () => state.life || {};

function drawHat(x, y, kind, now) {
  const s = S * .55;
  ctx.save(); ctx.translate(x, y); ctx.rotate(.22 + Math.sin(now / 900) * .04);

    ctx.restore(); ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(0, -s, s * .1, 0, Math.PI * 2); ctx.fill();

// What it says about your day: holidays, payday cycle, weather changes and long meetings.

function checkLife(now) {

// A line about today's weather and schedule, added to the morning greeting.
function lifeGreeting() {
  const L = life(), w = P('weather') ? L.weather : null, lines = [];
  if (w) {
    if (w.kind === 'rain' || w.kind === 'drizzle') lines.push('Rainy day ☔ grab an umbrella');
    else if (w.kind === 'storm') lines.push('Stormy out there ⛈️ stay cozy');
    else if (w.kind === 'snow') lines.push('Snow today ❄️ stay warm');

// ---------- main loop ----------
let last = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  think(now);

  // Where to look.
  if (touch) lookT = { x: clamp((touch.lx / W * 2 - 1) * 1.3, -1, 1), y: clamp((touch.ly / H * 2 - 1) * 1.3, -1, 1) };
  else if (ball) lookT = { x: clamp((ball.x / W * 2 - 1) * 1.3, -1, 1), y: clamp((ball.y / H * 2 - 1) * 1.3, -1, 1) };   // eyes on the ball
  else if (snack) lookT = { x: 0, y: .6 };
  else if (mood === 'sleeping' || mood === 'dozy') lookT = { x: 0, y: .15 };
  else if (lookHold && now < lookHold.until) lookT = { x: lookHold.x, y: lookHold.y };
  else if (now - flyStart < 6000) lookT = flyPos(now);
  else if (now < humUntil) lookT = { x: Math.sin(now / 400) * .35, y: -.1 };
  else if (mood === 'reading') lookT = readingLook(now);
  else if (mood === 'groove') lookT = { x: dance.sway * .35, y: -.05 };
  else if (mood === 'watching') lookT = { x: Math.sin(now / 4000) * .1, y: -.08 };   // glued to the screen
  else if (mood === 'typing') lookT = { x: Math.sin(now / 700) * .12, y: .55 };       // watching the keyboard
  else if (mood === 'loading' || mood === 'gaming') lookT = { x: 0, y: 0 };
  else if (mood === 'offline') lookT = { x: Math.sin(now / 1500) * .5, y: -.2 };   // looking around for the signal
  else if (mood === 'grumpy' || mood === 'sulk') lookT = { x: grumpySide * .8, y: .15 };
  else if (mood === 'bashful') lookT = { x: grumpySide * .7, y: .35 };
  else if (reminding || mood === 'surprised' || mood === 'dizzy') lookT = { x: 0, y: 0 };
  else if (mood === 'meeting' && now - lastMove > 1500) lookT = { x: 0, y: .1 };
  else if (motionOn && !sensor.flat && Math.hypot(sensor.tiltX, sensor.tiltY) > .18) lookT = { x: sensor.tiltX * 1.4, y: sensor.tiltY * 1.4 };   // eyes roll downhill like marbles
  else if (mood === 'relaxed') lookT = { x: 0, y: -.45 };   // gazing up at the ceiling
  else if (mood === 'sad') lookT = { x: grumpySide * .3, y: .45 };                        // downcast
  else if (mood === 'annoyed') lookT = { x: grumpySide * .85, y: 0 };                     // side-eye
  else if (mood === 'angry') lookT = { x: grumpySide * .9, y: .1 };                       // turned away from you
  else if (mood === 'tired') lookT = { x: 0, y: .3 };
  else if (mood === 'bored' && now - lastMove > 1500) lookT = { x: Math.sin(now / 2500) * .7, y: -.3 };
  else if (connected(now) && now - lastMove < 2500 && now < wrongWayUntil) lookT = { x: -clamp(state.x, -1, 1), y: -clamp(state.y, -1, 1) };   // Cheeky: the wrong way, on purpose
  else if (connected(now) && now - lastMove < 2500) lookT = { x: clamp(state.x, -1, 1), y: clamp(state.y, -1, 1) };
  else if (expr && expr.lookAt) lookT = expr.lookAt;
  else if ((mood === 'clingy' || mood === 'lonely') && now > nextSaccade) {   // keeps looking at you, hopefully
    nextSaccade = now + 1500 + Math.random() * 2000;
    lookT = { x: (Math.random() - .5) * .2, y: mood === 'lonely' ? .1 : -.1 };
  } else if (now > nextSaccade) {
    nextSaccade = now + (1200 + Math.random() * 3000) * (trait().hyper ? .5 : 1);
    lookT = Math.random() < .35 ? { x: 0, y: 0 } : { x: (Math.random() * 2 - 1) * .7, y: (Math.random() * 2 - 1) * .5 };
  }

  // Holding a finger still on it: it gets curious about your finger.
  // Holding a finger still: it gets curious about your finger; keep holding and the tool menu opens.
  if (touch && !touch.moved && now - touch.t > 550) {
    if (!tool) {
      if (!touch.curious) { touch.curious = true; sfx.curious(); }
      setOverride('curious', 300);
    }
    if (now - touch.t > HOLD_MS && (P('toolbox') || tool)) { const { lx, ly } = touch; touch = null; openMenu(lx, ly); }
  }
  if (hugAt && fingers.size >= 2 && now >= hugAt) hug();
  ballTick(now, dt);
  toolTick(now);
  listen(now);
  if (DEMO && mood === 'groove' && !songPlaying() && now - lastBeat > 500) beat(now);   // mood-button demo has no music
  if (mood === 'sleeping' && now > nextSnore) { nextSnore = now + 3800; sfx.snore(); }

  const T = MOODS[mood], ed = { ...((expr && expr.d) || {}) }, inner = feelingNow();
  if (dance.lid) { ed.lidL = (ed.lidL || 0) + dance.lid; ed.lidR = (ed.lidR || 0) + dance.lid; }   // dreamy sway / headbang squint
  const frown = (mood === 'neutral' ? trait().frown : 0)
    + (inner && ['annoyed', 'angry'].includes(inner.feeling) && ['focused', 'typing', 'reading'].includes(mood) ? .2 : 0);   // still cross while you work
  const ks = 1 - Math.exp(-dt * 8), kl = 1 - Math.exp(-dt * (mood === 'focused' ? 18 : mood === 'reading' ? 6 : 12));
  for (const k of ['w', 'h', 'lidL', 'lidR', 'happy', 'sparkle', 'spiral', 'glasses']) cur[k] += (T[k] + (ed[k] || 0) - cur[k]) * ks;
  cur.tilt += (T.tilt + (ed.tilt || 0) + frown - cur.tilt) * ks;
  for (let i = 0; i < 3; i++) col[i] += (T.color[i] - col[i]) * ks;
  look.x += (lookT.x - look.x) * kl; look.y += (lookT.y - look.y) * kl;
  danceTick();
  faceTilt += (dance.tilt - faceTilt) * (1 - Math.exp(-dt * 10));

  if (now > nextBlink && mood !== 'sleeping' && mood !== 'dizzy') {
    blinkStart = now; blinkDur = 160;
    nextBlink = now + (Math.random() < .15 ? 260 : 2000 + Math.random() * 4500);
  }
  if (mood === 'clingy' && Math.random() < dt * .6) bounceV -= 2;   // little hopeful hops
  const bt = (now - blinkStart) / blinkDur;
  const blink = bt < 1 ? 1 - .92 * Math.sin(bt * Math.PI) : 1;

  bounceV += (-140 * bounce - 9 * bounceV) * dt;
  bounce += bounceV * dt;

  if (tool) drawTool(now, blink); else draw(now, blink);
  drawHoldRing(now);
  if (now - lightningAt < 260) {   // lightning
    ctx.fillStyle = `rgba(220,230,255,${(1 - (now - lightningAt) / 260) * .45})`; ctx.fillRect(0, 0, W, H);
  }
  if (now < flashUntil) {   // screenshot: camera flash
    ctx.fillStyle = `rgba(255,255,255,${(flashUntil - now) / 260 * .85})`; ctx.fillRect(0, 0, W, H);
  }
  requestAnimationFrame(frame);
}

function drawSnack(now, cx, cy, color) {
  if (!snack) return;

    floaty(s.icon, mouth.x, mouth.y, S * .45 * (1 - bites * .12), 1, color); ctx.restore();
    for (let i = 0; i < 5; i++) {   // crumbs (or sparks)
      const q = ((t - 900) / 600 + i / 5) % 1;

      ctx.beginPath(); ctx.arc(mouth.x + (i - 2) * S * .1, mouth.y + q * S * .5, S * .025, 0, Math.PI * 2); ctx.fill();

}

// A ball: fling it around, and it watches it and headbutts it back when it comes close.
let ball = null;   // { x, y, vx, vy, held, lastTouch, played }
function startBall() {
  closeSheet(); closeMenu(); cancelQuirk(); if (tool) endTool();
  ball = { x: W * .2, y: H * .3, vx: W * .6, vy: -H * .2, held: null, lastTouch: performance.now(), played: false };
  setOverride('surprised', 700); sfx.chirp();
  say('Ball!! 🎾 Fling it to me!', 2200, false);
}
function ballTick(now, dt) {
  if (!ball) return;
  if (ball.held) return;
  const r = S * .16;
  ball.vy += H * 1.6 * dt; ball.x += ball.vx * dt; ball.y += ball.vy * dt;
  if (ball.x < r) { ball.x = r; ball.vx = Math.abs(ball.vx) * .8; }
  if (ball.x > W - r) { ball.x = W - r; ball.vx = -Math.abs(ball.vx) * .8; }
  if (ball.y < r) { ball.y = r; ball.vy = Math.abs(ball.vy) * .8; }
  if (ball.y > H - r) { ball.y = H - r; ball.vy = -Math.abs(ball.vy) * .72; ball.vx *= .92; if (Math.abs(ball.vy) > H * .3) pluck(330, 0, .03, .3); }
  if (Math.hypot(ball.x - W / 2, ball.y - H / 2) < S * .85 && ball.vy > -H * .2 && rateOk('headbutt', 600)) {   // headbutt!

  $('clock').textContent = d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  $('cpu').style.width = clamp(state.cpu, 0, 100) + '%';
  $('ram').style.width = clamp(state.ram, 0, 100) + '%';
  $('work').textContent = `⏱ ${Math.floor(state.work)}m`;
  $('mailc').textContent = state.mail ? `✉ ${state.mail.unread}` : '';
  const next = state.calendar && state.calendar.events.find(e => e.start * 1000 > Date.now());
  $('next').textContent = next ? `📅 ${new Date(next.start * 1000).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}` : '';
  $('pcchip').textContent = state.pcs ? `💻 ${state.pcs.showing}${state.pcs.pin ? ' 📌' : ''}` : '';
  $('bond').textContent = state.buddy ? `${FEEL_ICON[(P('needs') && state.heart && state.heart.feeling) || 'okay']} Lv${state.buddy.level}` : '';
  const t = kit.timer, p = kit.pomo, running = [];   // tools still ticking in the background
  if (t.end || t.pausedLeft) running.push(`⏳ ${mmss(timerLeft())}`);
  if (kit.watch.start) running.push(`⏱ ${mmss(watchTime())}`);
  if (p.end || p.pausedLeft) running.push(`🍅 ${mmss(pomoLeft())}`);
  if (micStream) running.push('🎙');   // shows whenever the mic is listening
  $('running').textContent = running.join('  ');
  $('batt').textContent = battery ? `${battery.charging ? '⚡' : '🔋'}${Math.round(battery.level * 100)}%` : '';
  const a = state.activity, kindNow = connected(performance.now()) ? mediaKind(performance.now()) : null;
  $('doing').textContent = a && P('patterns') ? `${a.emoji} ${dur(Math.floor(a.minutes))}` : '';
  $('playing').textContent = songPlaying() || kindNow ? (kindNow === 'movie' ? '🍿' : kindNow === 'music' ? '🎵' : '🎬') : '';
  if (!DEMO && connected(performance.now())) reportTools();   // every second, for the dashboard's Tools page
  checkBattery();
  if (sheetKind === 'running' || sheetKind === 'work') openSheet(sheetKind);   // keep live numbers ticking
}, 1000);

addEventListener('resize', resize);
resize();
requestAnimationFrame(frame);
</script>
</body>
</html>
